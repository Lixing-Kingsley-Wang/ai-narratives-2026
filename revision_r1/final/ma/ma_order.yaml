# Order of the supplementary units (JMIR R1 Batch 2c, C4).
#
# Supplementary numbering must follow the order of first citation in the REVISED
# manuscript. This is a DEFAULT order (roughly Methods -> Results). To change it:
#   1. reorder (do not rename) the unit IDs below; every unit must appear once;
#   2. run:  ../.venv/bin/python assemble.py   (from revision_r1/final/ma/)
# The assembler numbers figures S1, S2, ... in Multimedia Appendix 2 and tables
# S1, S2, ... in Multimedia Appendix 3, resolves every {{F:id}} / {{T:id}}
# cross-reference inside captions and footnotes, and rewrites the .docx/.md
# appendices and ma_numbering_map.csv. Unit content lives in units/ and is
# produced by ../scripts/c4_units.py.

